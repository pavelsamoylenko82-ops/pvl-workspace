services:
  lead-api:
    build: .
    container_name: pvl-lead-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8085:8085"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
